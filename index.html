  <body class="bg-gray-900 text-gray-100 font-['Poppins'] antialiased">
    <div id="root"></div>

    <!-- EmailJS SDK -->
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"
    ></script>

    <!-- Visitor Notification Script -->
    <script type="text/javascript">
      (function () {
        // আপনার Public Key সেট করা হয়েছে
        emailjs.init("v1t7slolTNj2h4VZY");
      })();

      function sendEmailNotification() {
        fetch("https://ipapi.co/json/")
          .then((res) => res.json())
          .then((data) => {
            const templateParams = {
              country: data.country_name || "Unknown",
              city: data.city || "Unknown",
              ip: data.ip || "Unknown",
              user_agent: navigator.userAgent.slice(0, 60) + "...",
              page_url: window.location.href,
              visit_time: new Date().toLocaleString(),
            };

            // আপনার Service ID এবং Template ID যুক্ত করা হয়েছে
            emailjs
              .send("service_sf7rebt", "template_84sihts", templateParams)
              .then(
                function (response) {
                  console.log("Visitor alert sent successfully!");
                },
                function (error) {
                  console.error("EmailJS notification failed:", error);
                },
              );
          })
          .catch((err) => console.error("Location fetch error:", err));
      }

      window.addEventListener("DOMContentLoaded", sendEmailNotification);
    </script>

  </body>
</html>
